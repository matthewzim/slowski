<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slowski — Infinite Downhill Skiing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
        }

        /* HUD overlay */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #speed-display {
            position: absolute;
            top: 24px;
            right: 32px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #speed-display span {
            font-size: 14px;
            opacity: 0.6;
            letter-spacing: 1px;
        }
        #distance-display {
            position: absolute;
            top: 60px;
            right: 32px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Controls hint */
        #controls-hint {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            pointer-events: none;
            transition: opacity 2s ease;
        }

        /* Time-of-day menu */
        #time-menu-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 10px 24px;
            font-size: 13px;
            font-family: inherit;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.3s, transform 0.2s;
        }
        #time-menu-btn:hover {
            background: rgba(0, 0, 0, 0.55);
            transform: translateX(-50%) scale(1.04);
        }
        #time-menu-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 25;
            background: rgba(10, 12, 20, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 28px 24px 36px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #time-menu-panel.open {
            transform: translateY(0);
        }
        #time-menu-panel h3 {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        .time-options {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .time-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.7);
        }
        .time-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .time-option.active {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .time-option .time-icon {
            font-size: 28px;
            line-height: 1;
        }
        .time-option .time-label {
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* Title screen */
        #title-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: linear-gradient(180deg, #87CEEB 0%, #E8F0FE 40%, #FFFFFF 100%);
            transition: opacity 1s ease;
        }
        #title-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #title-screen h1 {
            font-size: 72px;
            font-weight: 200;
            color: #2c3e50;
            letter-spacing: 12px;
            margin-bottom: 16px;
        }
        #title-screen p {
            font-size: 16px;
            color: #5a7a9a;
            letter-spacing: 3px;
            margin-bottom: 48px;
        }
        #start-btn {
            padding: 14px 48px;
            font-size: 16px;
            letter-spacing: 3px;
            color: #fff;
            background: rgba(44, 62, 80, 0.8);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            cursor: pointer;
            pointer-events: all;
            transition: background 0.3s, transform 0.2s;
        }
        #start-btn:hover {
            background: rgba(44, 62, 80, 1);
            transform: scale(1.04);
        }
    </style>
</head>
<body>
    <!-- Title screen -->
    <div id="title-screen">
        <h1>SLOWSKI</h1>
        <p>INFINITE DOWNHILL SKIING</p>
        <button id="start-btn">START SKIING</button>
    </div>

    <!-- In-game HUD -->
    <div id="hud" style="display:none;">
        <div id="speed-display">0 <span>KM/H</span></div>
        <div id="distance-display">0 m</div>
    </div>
    <div id="controls-hint" style="display:none;">A / D or ← → to steer &nbsp;&nbsp;|&nbsp;&nbsp; SPACE to jump</div>

    <!-- Time-of-day menu -->
    <button id="time-menu-btn" style="display:none;">TIME OF DAY</button>
    <div id="time-menu-panel">
        <h3>TIME OF DAY</h3>
        <div class="time-options">
            <button class="time-option active" data-time="morning">
                <span class="time-icon">&#9788;</span>
                <span class="time-label">MORNING</span>
            </button>
            <button class="time-option" data-time="midday">
                <span class="time-icon">&#9728;</span>
                <span class="time-label">MIDDAY</span>
            </button>
            <button class="time-option" data-time="sunset">
                <span class="time-icon">&#9730;</span>
                <span class="time-label">SUNSET</span>
            </button>
        </div>
    </div>

    <!-- Three.js and noise library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@3.0.1/dist/cjs/simplex-noise.js" onerror="
        // Fallback: define our own simplex noise if CDN fails
        window.simplexFallback = true;
    "></script>
    <script src="main.js"></script>
</body>
</html>
