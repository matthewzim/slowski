<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whistler Blackcomb - Ski Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }
    #hud .timer {
      font-size: 28px; font-weight: bold;
      background: rgba(0,0,0,0.4); padding: 6px 16px;
      border-radius: 8px; display: inline-block;
    }
    #hud .speed {
      font-size: 18px; margin-top: 8px;
      background: rgba(0,0,0,0.4); padding: 4px 12px;
      border-radius: 6px; display: inline-block;
    }
    #hud .elevation {
      font-size: 14px; margin-top: 4px;
      background: rgba(0,0,0,0.3); padding: 4px 12px;
      border-radius: 6px; display: inline-block;
    }
    #controls-info {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      font-size: 14px; background: rgba(0,0,0,0.4);
      padding: 8px 20px; border-radius: 8px; z-index: 10;
      opacity: 0.8;
    }
    #minimap {
      position: fixed; bottom: 20px; left: 20px; z-index: 10;
      width: 160px; height: 160px;
      border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.3);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #minimap:hover { border-color: rgba(255,255,255,0.9); }
    #minimap canvas { width: 100%; height: 100%; }
    #terrain-map-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      cursor: default;
    }
    #terrain-map-overlay.open { display: flex; }
    #terrain-map-container {
      position: relative;
      background: rgba(20,30,50,0.95);
      border-radius: 12px; padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #terrain-map-container h2 {
      color: #fff; font-size: 16px; margin-bottom: 10px;
      text-align: center; font-weight: 500;
    }
    #terrain-map-container .close-btn {
      position: absolute; top: 8px; right: 12px;
      color: #aaa; font-size: 22px; cursor: pointer;
      background: none; border: none; line-height: 1;
    }
    #terrain-map-container .close-btn:hover { color: #fff; }
    #terrain-map-canvas { cursor: crosshair; border-radius: 4px; }
    #terrain-map-tooltip {
      position: absolute; pointer-events: none;
      background: rgba(0,0,0,0.8); color: #fff;
      padding: 4px 10px; border-radius: 4px; font-size: 12px;
      display: none; white-space: nowrap;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a3a5c, #2d5a87);
      color: #fff; font-size: 24px; flex-direction: column; gap: 20px;
    }
    #loading .bar { width: 300px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; }
    #loading .bar-fill { height: 100%; background: #fff; border-radius: 3px; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div id="loading">
    <div>Whistler Blackcomb</div>
    <div style="font-size:14px; opacity:0.7;" id="load-status">Generating terrain...</div>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
  </div>
  <div id="hud">
    <div class="timer" id="timer">00'00"</div>
    <div class="speed" id="speed-display">0 km/h</div>
    <div class="elevation" id="elev-display">Elev: 0m</div>
  </div>
  <div id="minimap"><canvas id="minimap-canvas" width="160" height="160"></canvas></div>
  <div id="terrain-map-overlay">
    <div id="terrain-map-container">
      <h2>Blackcomb Mountain - Trail Map</h2>
      <button class="close-btn" id="terrain-map-close">&times;</button>
      <canvas id="terrain-map-canvas" width="600" height="600"></canvas>
      <div id="terrain-map-tooltip"></div>
    </div>
  </div>
  <div id="lift-prompt" style="display:none; position:fixed; bottom:70px; left:50%; transform:translateX(-50%); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.7); font-size:18px; background:rgba(0,100,200,0.6); padding:10px 24px; border-radius:10px; z-index:10; font-weight:bold; animation:pulse 1.5s infinite;"></div>
  <div id="controls-info">Arrow Keys / WASD to steer &bull; Space to skate forward &bull; &darr; / S to brake &bull; E for chairlift &bull; R to reset &bull; M for trail map</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
