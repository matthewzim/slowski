<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slowski — Infinite Downhill Skiing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
        }

        /* HUD overlay */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #speed-display {
            position: absolute;
            bottom: 40px;
            right: 40px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        #speed-display span {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            display: block;
        }

        #distance-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        #controls-hint {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 300;
            line-height: 1.8;
            letter-spacing: 1px;
            transition: opacity 1s ease;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #E8F4FD 50%, #FAFAFA 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease;
        }

        #loading h1 {
            font-size: 64px;
            font-weight: 200;
            color: rgba(40, 60, 80, 0.8);
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        #loading p {
            font-size: 14px;
            color: rgba(40, 60, 80, 0.4);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>Slowski</h1>
        <p>Loading terrain...</p>
    </div>

    <div id="hud">
        <div id="distance-display">0 m</div>
        <div id="speed-display">0<span>km/h</span></div>
        <div id="controls-hint">
            A / D — steer<br>
            SPACE — jump
        </div>
    </div>

    <!-- Three.js and noise library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@3.0.1/dist/cjs/simplex-noise.js"></script>
    <script src="main.js"></script>
</body>
</html>
